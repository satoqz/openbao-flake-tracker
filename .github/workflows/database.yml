name: Update Database

on:
  schedule:
    - cron: 5 4 * * *
  workflow_dispatch:
    inputs:
      days:
        type: number
        default: 2
      drop:
        type: boolean
        default: false
      restore_from:
        type: string
        required: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Install dependencies
        run: uv sync --locked

      - name: Restore database
        run: uv run --no-sync src/restore.py
        if: ${{ github.event_name == 'schedule' || !inputs.drop }}
        env:
          GITHUB_TOKEN: ${{ secrets.PAT }}
          RESTORE_FROM: ${{ inputs.restore_from }}

      - name: Update database
        run: uv run --no-sync src/database.py
        env:
          DAYS: ${{ github.event_name == 'schedule' && '2' || inputs.days }}
          GITHUB_TOKEN: ${{ secrets.PAT }}

      - name: Migrate database
        run: uv run --no-sync src/migrate.py

      - name: Save database
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          path: tests.db

      - name: Update comment
        run: uv run --no-sync src/comment.py
        env:
          ISSUE_NUMBER: ${{ secrets.ISSUE_NUMBER }}
          GITHUB_TOKEN: ${{ secrets.PAT }}
